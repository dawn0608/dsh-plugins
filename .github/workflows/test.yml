name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synchronization test dependencies
        run: python -m pip install -r plugins/mcp-manager/src/sync/requirements.txt
      - name: Install tooling
        run: npm ci
      - name: Verify plugins, tooling and template
        run: npm run verify
